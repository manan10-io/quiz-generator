version: "3.9"

# ─── QuizGen AI — full stack ────────────────────────────────────────────────────
# Run with: docker compose up --build
# This spins up everything needed for a complete local run: Postgres for
# persistent storage, Redis for the Celery job queue, the FastAPI backend
# (with Tesseract OCR baked in), and the Next.js frontend.
#
# For active development with hot-reload, use docker-compose.dev.yml instead:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  postgres:
    image: postgres:15-alpine
    container_name: quizgen-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: quizgen
      POSTGRES_PASSWORD: quizgen_dev_password
      POSTGRES_DB: quizgen
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quizgen"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: quizgen-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: quizgen-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://quizgen:quizgen_dev_password@postgres:5432/quizgen
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: production
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?GOOGLE_CLIENT_ID must be set in .env}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?GOOGLE_CLIENT_SECRET must be set in .env}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:3000/api/auth/callback/google}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_CLEANUP_ENABLED: ${AI_CLEANUP_ENABLED:-true}
      GOOGLE_VISION_API_KEY: ${GOOGLE_VISION_API_KEY:-}
      USE_GOOGLE_VISION: ${USE_GOOGLE_VISION:-false}
      CORS_ORIGINS: '["http://localhost:3000"]'
    ports:
      - "8000:8000"
    volumes:
      - export_files:/tmp/quizgen_exports
      - upload_files:/tmp/quizgen_uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    container_name: quizgen-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?NEXTAUTH_SECRET must be set in .env}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?GOOGLE_CLIENT_ID must be set in .env}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?GOOGLE_CLIENT_SECRET must be set in .env}
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  redis_data:
  export_files:
  upload_files:
